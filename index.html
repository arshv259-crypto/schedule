<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arsh's Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2a33;--paper:#fdf6e3;--pink:#ff8fa3;--yel:#ffd166}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:20px/1.3 'Patrick Hand','Comic Sans MS',cursive;color:var(--ink);background:var(--paper) radial-gradient(#d8cdb0 1px,transparent 1.3px) 0 0/22px 22px;overflow-x:hidden}
h1,h2,.time,.cnt,.go{font-family:Caveat,'Comic Sans MS',cursive}
.bar{position:fixed;inset:0 0 auto 0;z-index:9;background:var(--paper);border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;padding:6px 14px}
.cnt{font-size:28px;font-weight:700}
.go{font-size:24px;font-weight:700;background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;padding:0 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.prog{position:absolute;left:0;bottom:-3px;height:5px;width:0;background:var(--pink)}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:90px 20px 40px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(56px,16vw,130px);line-height:.9;position:relative;z-index:1}
.hero p{font-size:22px;margin-top:22px;position:relative;z-index:1}
.under{width:min(420px,80vw);display:block;margin:6px auto 0}
.under path{stroke:var(--pink);stroke-width:7;fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .4s forwards}
.fl{position:absolute;width:60px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.cue{display:block;margin:34px auto 0;width:40px;animation:bob 1.4s ease-in-out infinite;stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{50%{transform:translateY(14px)}}
.sec{padding:50px 18px 90px;background:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1.3px) 0 0/22px 22px,var(--bg);border-top:4px dashed var(--ink)}
.morning{--bg:#fff0d6;--acc:#ffc27a;--line:var(--ink)}
.afternoon{--bg:#def2fb;--acc:#8ed0ef;--line:var(--ink)}
.night{--bg:#2d3063;--acc:#b7a6ff;--line:var(--paper);color:var(--paper)}
.sec header{text-align:center}
.sec h2{font-size:64px;line-height:1}
.sec header span{font-size:20px;opacity:.8}
.scene{width:min(320px,85%);display:block;margin:0 auto;color:var(--ink);stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.night .scene{color:var(--paper)}
.rays line{animation:ray 1.4s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.2}to{opacity:1}}
.spin{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:float 5s ease-in-out infinite alternate}
@keyframes float{to{transform:translateX(24px)}}
.star{animation:tw 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes tw{from{opacity:.3;transform:scale(.6)}to{opacity:1;transform:scale(1.1)}}
.tl{max-width:640px;margin:36px auto 0;position:relative;padding-left:56px}
.tl::before{content:"";position:absolute;left:19px;top:0;bottom:0;border-left:4px dashed var(--line);opacity:.4}
.tl::after{content:"";position:absolute;left:17px;top:0;bottom:0;width:8px;border-radius:4px;background:var(--acc);border:2px solid var(--line);transform-origin:top;transform:scaleY(var(--p,0))}
.item{position:relative;margin-bottom:28px;opacity:0;transform:translateY(40px) rotate(-1.5deg);transition:opacity .5s,transform .7s cubic-bezier(.2,.9,.3,1.3)}
.item.in{opacity:1;transform:none}
.dot{position:absolute;left:-47px;top:24px;width:24px;height:24px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);z-index:1;transition:.4s}
.item.in .dot{background:var(--acc)}
.card{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--ink);background:#fffdf5;border:3px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:14px 46px 14px 16px;box-shadow:5px 6px 0 var(--ink);cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s,background .3s}
.item:nth-child(even) .card{border-radius:18px 255px 18px 225px/225px 18px 255px 18px}
.card:hover{transform:translate(-2px,-2px) rotate(-.6deg);box-shadow:8px 9px 0 var(--ink)}
.card:focus-visible{outline:3px dashed var(--pink);outline-offset:4px}
.ic{width:60px;height:60px;flex:none;background:var(--acc);border:2.5px solid var(--ink);border-radius:50%;padding:9px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ic *{stroke-dasharray:1;stroke-dashoffset:1}
.ic text{stroke:none;fill:var(--ink);font:700 19px Caveat,cursive;stroke-dasharray:none;stroke-dashoffset:0}
.item.in .ic *:not(text){animation:draw 1.1s .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.time{font-size:30px;font-weight:700;line-height:1}
.t{font-size:21px}
.t small{display:block;font-size:16px;opacity:.7}
.now .card{background:#fff3b0;animation:wig 2s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(.7deg) translateY(-3px)}}
.cv{position:absolute;right:16px;top:32px;width:26px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s}
.open .cv{transform:rotate(180deg)}
.art{flex:0 0 100%;max-height:0;margin-top:-14px;overflow:hidden;transition:max-height .6s ease,margin .6s ease}
.open .art{max-height:260px;margin-top:0}
.art svg{display:block;width:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;border:2.5px dashed var(--ink);border-radius:16px;background:#fff8e6}
.art *{stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0}
@keyframes fl{to{fill-opacity:1}}
.art text{stroke:none;fill:currentColor;stroke-dasharray:none;stroke-dashoffset:0;fill-opacity:1}
.open .art *:not(text){animation:draw 1s forwards,fl .4s forwards}
.tag{display:none;position:absolute;top:-16px;right:26px;z-index:2;background:var(--pink);color:var(--ink);font:700 22px Caveat,cursive;border:3px solid var(--ink);border-radius:12px;padding:0 10px;transform:rotate(3deg)}
.now .tag{display:block}
footer{background:var(--bg,#2d3063);--bg:#2d3063;color:var(--paper);text-align:center;padding:10px 20px 90px}
footer svg{width:110px;fill:var(--pink);stroke:var(--paper);stroke-width:3;stroke-linejoin:round;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
footer h2{font-size:50px;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ic *,.under path,.art *{stroke-dashoffset:0;fill-opacity:1}.item{opacity:1;transform:none}}
</style></head>

 if(d[5]!==cur){ if(cur)html+='</div></section>'; cur=d[5]; const s=S[cur];
  html+=`<section class="sec ${cur}"><header>${s[2]()}<h2>${s[0]}</h2><span>${s[1]}</span></header><div class="tl">`}
 const ic=IC[d[4]]||d[4];
 html+=`<div class="item" data-i="${i}"><div class="dot"></div><div class="tag">you are here</div>
 <div class="card" tabindex="0" role="button" aria-expanded="false"><svg class="ic" viewBox="0 0 48 48">${ic}</svg>
 <div><div class="time">${d[0]}</div><div class="t">${d[2]}${d[3]?`<small>${d[3]}</small>`:''}</div></div>
 <svg class="cv" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg><div class="art"><svg viewBox="0 0 300 124">${ART[i]}</svg></div></div></div>`;
});

document.querySelectorAll('.ic *:not(text)').forEach(e=>e.setAttribute('pathLength',1));

const items=[...document.querySelectorAll('.item')];
items.forEach(el=>{const c=el.querySelector('.card'),t=()=>{el.classList.toggle('open');c.setAttribute('aria-expanded',el.classList.contains('open'))};
 c.onclick=t;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}});

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.25});
items.forEach(e=>io.observe(e));

function nowIdx(){const n=new Date(),m=n.getHours()*60+n.getMinutes();if(m<60)return D.length-1;let k=-1;D.forEach((d,i)=>{if(d[1]<=m)k=i});return k}
let ni=nowIdx();if(ni>=0)items[ni].classList.add('now');
document.getElementById('go').onclick=()=>{ni=nowIdx();ni<0?scrollTo({top:0}):items[ni].scrollIntoView({block:'center'})};

const sh=[['M8 30c6-14 14-14 14 0s8 14 14 0','0.15'],['M30 6l6 16 16 2-12 10 4 16-14-9-14 9 4-16L8 24l16-2z','0.35'],['M6 30h48M30 6v48','0.25'],['M30 8a22 22 0 1 0 0 44a22 22 0 0 0 0-44zM30 18a12 12 0 1 0 0 24','0.1'],['M30 8L54 52H6z','0.3'],['M8 40c10-30 30 10 40-20','0.2']];

const fl=[...bg.children],tls=[...document.querySelectorAll('.tl')],prog=document.getElementById('prog');
function onScroll(){const y=scrollY;fl.forEach(f=>f.style.transform=`translateY(${-y*f.dataset.s}px) rotate(${y*.1}deg)`);
 tls.forEach(t=>{const r=t.getBoundingClientRect();t.style.setProperty('--p',Math.min(1,Math.max(0,(innerHeight*.6-r.top)/r.height)))});
 prog.style.width=(y/(document.body.scrollHeight-innerHeight)*100)+'%'}
addEventListener('scroll',onScroll,{passive:true});onScroll();
